<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ee" />
    <title>Asisten di terminal kamu — Amagi CLI</title>
    <meta name="description" content="Ngobrol dengan Lyra, urus file project, dan simpan catatan dari terminal. Panduan instalasi, perintah, dan model Amagi CLI." />
    <script>
      try {
        const theme = localStorage.getItem('amagi-theme');
        if (theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
